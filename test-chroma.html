<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChromaCode Mobile Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- OpenCV.js for heavy image processing -->
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" type="text/javascript"></script>
    <style>
        #video-container { position: relative; overflow: hidden; border-radius: 24px; }
        #overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
        .scanning-line {
            position: absolute; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #6366f1, transparent);
            box-shadow: 0 0 15px #6366f1;
            animation: scan 2s linear infinite;
        }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans overflow-hidden">

    <div class="flex flex-col h-screen p-4">
        <!-- Header -->
        <div class="flex items-center justify-between mb-4">
            <div>
                <h1 class="text-xl font-black tracking-tight text-indigo-400">CHROMACODE</h1>
                <p class="text-[10px] text-slate-400 uppercase font-bold">v3.0 CMYK Multi-Spectral Scanner</p>
            </div>
            <div id="status-pill" class="px-3 py-1 bg-slate-800 rounded-full text-[10px] font-bold border border-slate-700">
                INITIATING...
            </div>
        </div>

        <!-- Viewfinder -->
        <div id="video-container" class="flex-1 bg-black border border-slate-800 shadow-2xl relative">
            <video id="video" playsinline class="w-full h-full object-cover opacity-60"></video>
            <canvas id="overlay" class="w-full h-full"></canvas>
            <div class="scanning-line"></div>
            
            <!-- Corner Guides -->
            <div class="absolute top-8 left-8 w-12 h-12 border-t-4 border-l-4 border-indigo-500/50 rounded-tl-lg"></div>
            <div class="absolute top-8 right-8 w-12 h-12 border-t-4 border-r-4 border-indigo-500/50 rounded-tr-lg"></div>
            <div class="absolute bottom-8 left-8 w-12 h-12 border-b-4 border-l-4 border-indigo-500/50 rounded-bl-lg"></div>
            <div class="absolute bottom-8 right-8 w-12 h-12 border-b-4 border-r-4 border-indigo-500/50 rounded-br-lg"></div>
        </div>

        <!-- Result Panel -->
        <div class="mt-4 p-4 bg-slate-800/50 rounded-3xl border border-slate-700/50 backdrop-blur-md mb-2">
            <div class="flex items-center gap-3 mb-2">
                <div id="calibration-dot" class="w-3 h-3 bg-slate-600 rounded-full"></div>
                <span class="text-xs font-bold text-slate-300">DECODED PAYLOAD</span>
            </div>
            <div id="result-text" class="text-sm font-medium text-slate-400 italic">
                Point camera at a ChromaCode...
            </div>
        </div>
        
        <!-- Controls -->
        <div class="flex gap-2 mb-4">
            <button id="start-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-4 rounded-2xl font-bold text-sm transition-all shadow-lg active:scale-95">
                START SCANNER
            </button>
        </div>
    </div>

    <script>
        let video = document.getElementById('video');
        let canvas = document.createElement('canvas'); // Hidden processing canvas
        let ctx = canvas.getContext('2d', { willReadFrequently: true });
        let isRunning = false;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", focusMode: "continuous" }, 
                    audio: false 
                });
                video.srcObject = stream;
                video.play();
                document.getElementById('status-pill').innerText = "READY";
                document.getElementById('status-pill').classList.replace('bg-slate-800', 'bg-green-500/20');
                isRunning = true;
                requestAnimationFrame(processFrame);
            } catch (err) {
                document.getElementById('result-text').innerText = "Camera access denied.";
            }
        }

        function processFrame() {
            if (!isRunning || typeof cv === 'undefined') return;

            // 1. Capture current frame to hidden canvas
            canvas.width = video.videoWidth / 2; // Downscale for mobile performance
            canvas.height = video.videoHeight / 2;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 2. OpenCV Processing
            try {
                let src = cv.imread(canvas);
                let gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                
                // Adaptive threshold to find the 'K' (Black) outboxes
                let thresh = new cv.Mat();
                cv.adaptiveThreshold(gray, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 11, 2);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(thresh, contours, hierarchy, cv.RETR_TREE, cv.CHAIN_APPROX_SIMPLE);

                // 3. CMYK FINDER DETECTION LOGIC
                // Look for nested squares that indicate our finders
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let approx = new cv.Mat();
                    let peri = cv.arcLength(cnt, true);
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

                    if (approx.rows === 4) {
                        // Potential finder found. 
                        // To improve reliability: check hierarchy for inner CMY modules
                        // For this mobile demo, we visually highlight detected anchors
                        let rect = cv.boundingRect(approx);
                        if (rect.width > 20 && rect.height > 20) {
                            // Logic for spectral calibration would happen here
                            // Sampling center: src.ucharPtr(rect.y + rect.height/2, rect.x + rect.width/2)
                        }
                    }
                    approx.delete();
                }

                // Cleanup OpenCV objects
                src.delete(); gray.delete(); thresh.delete(); contours.delete(); hierarchy.delete();
            } catch (e) {
                console.error(e);
            }

            if (isRunning) requestAnimationFrame(processFrame);
        }

        document.getElementById('start-btn').onclick = () => {
            if (!isRunning) startCamera();
        };

        window.onload = () => {
            document.getElementById('status-pill').innerText = "CV.JS LOADING...";
            // Poll for OpenCV readiness
            let checkCV = setInterval(() => {
                if (typeof cv !== 'undefined' && cv.Mat) {
                    document.getElementById('status-pill').innerText = "STANDBY";
                    clearInterval(checkCV);
                }
            }, 500);
        };
    </script>
</body>
</html>
